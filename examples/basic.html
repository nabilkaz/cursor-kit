<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursor Theatre · module example</title><style>body{font:16px system-ui;background:#141515;color:#eee;margin:24px}#stage{height:340px;border:1px solid #444}button{font:inherit;padding:10px;margin:12px 8px 0 0}</style><h1>Module integration</h1><div id="stage"></div><button id="play">Play</button><button id="pause">Pause</button><button id="scrub">Inspect halfway</button><button id="remove">Remove cursor</button><script type="module">
import {createCursor} from '../src/index.js';
const actor=createCursor(document.querySelector('#stage'),{scene:'entrance',customLine:'Ready to go.'});
document.querySelector('#play').onclick=()=>actor.replay();
document.querySelector('#pause').onclick=()=>actor.pause();
document.querySelector('#scrub').onclick=()=>{actor.pause();actor.seek(.5)};
document.querySelector('#remove').onclick=()=>actor.remove();
</script></html>
